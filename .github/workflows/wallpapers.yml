name: Discover wallpapers
on:
  push:
    branches: [main]
    paths:
      - 'assets/backgrounds/photos/**'
      - 'assets/backgrounds/videos/**'
      - 'scripts/generate-wallpapers.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-wallpapers.mjs
      - name: Commit refreshed manifest
        run: |
          if git diff --quiet -- assets/backgrounds/manifest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/backgrounds/manifest.json
          git commit -m "Refresh wallpaper library"
          git push
