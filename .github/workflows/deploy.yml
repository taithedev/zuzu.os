name: Deploy zuzu.os
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check os-shell.js
          node --check os-team.js
          node --check os-desktop.js
      - name: Verify required site assets
        run: |
          test -f index.html
          test -f styles.css
          test -f zuzu-refresh.css
          test -f os-shell.css
          test -f os-shell.js
          test -f os-team.js
          test -f os-team.css
          test -f os-desktop.js
          test -f os-desktop.css
          test -f assets/wallpapers/aurora.svg
          test -f assets/wallpapers/obsidian.svg
          test -f assets/wallpapers/afterglow.svg
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
